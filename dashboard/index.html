<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DriftWatch — Drift Detector</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, sans-serif;
    background: #f6f7f9;
    color: #222;
    max-width: 900px;
    margin: 24px auto;
    padding: 0 16px;
  }
  h1 { margin: 0 0 8px; font-size: 24px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 24px; }
  .panel {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 16px; align-items: center; }
  .row > * { flex: 1; }
  .stat { font-size: 28px; font-weight: 700; }
  .label { font-size: 11px; text-transform: uppercase; color: #777; letter-spacing: 0.05em; }
  .ok { color: #1f7a3e; }
  .warn { color: #b00020; }
  .neutral { color: #444; }
  button {
    background: #2666ee;
    color: #fff;
    border: none;
    padding: 10px 20px;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #1a52d0; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
  th { background: #fafafa; font-weight: 600; color: #555; }
  .sev {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .sev-critical { background: #ffe1e1; color: #b00020; }
  .sev-high     { background: #ffe9d4; color: #c25c00; }
  .sev-medium   { background: #fff8d4; color: #8a6d00; }
  .sev-low      { background: #d9f0e1; color: #1f7a3e; }
  .empty { color: #888; padding: 12px 0; }
  pre { background: #1e1e1e; color: #ddd; padding: 12px; border-radius: 6px; font-size: 12px; max-height: 240px; overflow: auto; }
  code { background: #f0f0f0; padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>

<h1>DriftWatch</h1>
<div class="sub">GitOps Config Drift Detector · AWS · ap-south-1</div>

<div class="panel">
  <div class="row">
    <div>
      <div class="label">Status</div>
      <div id="status" class="stat neutral">Loading…</div>
      <div class="sub" id="statusSub"></div>
    </div>
    <div>
      <div class="label">Resources Checked</div>
      <div class="stat neutral" id="totalCount">0</div>
    </div>
    <div>
      <div class="label">Drifts Found</div>
      <div class="stat" id="driftCount">0</div>
    </div>
    <div style="text-align: right; flex: 0 0 auto;">
      <button id="scanBtn" onclick="triggerScan()">Run Scan Now</button>
    </div>
  </div>
</div>

<div class="panel">
  <div class="label" style="margin-bottom: 8px;">Drift Items</div>
  <table id="driftTable">
    <thead>
      <tr>
        <th>Resource</th>
        <th>Attribute</th>
        <th>Expected → Actual</th>
        <th>Severity</th>
      </tr>
    </thead>
    <tbody id="driftBody"></tbody>
  </table>
  <div id="driftEmpty" class="empty" style="display:none;">No drift detected — all resources match Terraform state.</div>
</div>

<div class="panel" id="logPanel" style="display: none;">
  <div class="label" style="margin-bottom: 8px;">Scan Log</div>
  <pre id="scanLog"></pre>
</div>

<div class="panel">
  <div class="label" style="margin-bottom: 8px;">Last Scan</div>
  <div class="sub" id="scanMeta">No scan yet</div>
</div>

<script>
async function loadReport() {
  try {
    const resp = await fetch('drift-report.json?_=' + Date.now());
    if (!resp.ok) throw new Error('not found');
    const r = await resp.json();
    render(r);
  } catch (e) {
    document.getElementById('status').textContent = 'No report yet';
    document.getElementById('statusSub').textContent = 'Click "Run Scan Now" to start';
  }
}

function render(r) {
  const items = r.drift_items || [];
  const total = r.total_resources_checked || 0;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('driftCount').textContent = items.length;

  const status = document.getElementById('status');
  const sub = document.getElementById('statusSub');
  if (items.length === 0 && total > 0) {
    status.textContent = '✓ Clean';
    status.className = 'stat ok';
    sub.textContent = 'All resources match Terraform state';
  } else if (items.length > 0) {
    status.textContent = '⚠ Drift Detected';
    status.className = 'stat warn';
    sub.textContent = items.length + ' attribute(s) differ';
  } else {
    status.textContent = 'No data';
    status.className = 'stat neutral';
    sub.textContent = '';
  }

  document.getElementById('scanMeta').textContent =
    `Scan ID: ${r.scan_id || '?'}   ·   ${new Date(r.timestamp).toLocaleString()}   ·   Region: ${r.aws_region || '?'}`;

  const tbody = document.getElementById('driftBody');
  const empty = document.getElementById('driftEmpty');
  if (items.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    tbody.innerHTML = items.map(d => `
      <tr>
        <td><code>${d.resource_type}</code><br><small style="color:#888">${d.resource_id}</small></td>
        <td><code>${d.attribute}</code></td>
        <td><span style="color:#1f7a3e">${fmt(d.expected)}</span> → <span style="color:#b00020">${fmt(d.actual)}</span></td>
        <td><span class="sev sev-${d.severity}">${d.severity}</span></td>
      </tr>`).join('');
  }
}

function fmt(v) {
  if (v === null || v === undefined) return 'null';
  const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
  return s.length > 60 ? s.slice(0, 60) + '…' : s;
}

function triggerScan() {
  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.textContent = 'Scanning…';
  document.getElementById('logPanel').style.display = 'block';
  document.getElementById('scanLog').textContent = '';

  fetch('/api/scan').then(r => r.json()).then(data => {
    if (!data.started) {
      btn.disabled = false;
      btn.textContent = 'Run Scan Now';
      alert('Scan already running');
      return;
    }
    streamLogs();
  }).catch(() => {
    btn.disabled = false;
    btn.textContent = 'Run Scan Now';
    alert('Server unreachable');
  });
}

function streamLogs() {
  const es = new EventSource('/api/scan/logs');
  const log = document.getElementById('scanLog');
  es.onmessage = e => {
    const data = JSON.parse(e.data);
    if (data.line) {
      log.textContent += data.line + '\n';
      log.scrollTop = log.scrollHeight;
    }
  };
  es.addEventListener('done', async () => {
    es.close();
    await loadReport();
    const btn = document.getElementById('scanBtn');
    btn.disabled = false;
    btn.textContent = 'Run Scan Now';
  });
  es.onerror = () => {
    es.close();
    const btn = document.getElementById('scanBtn');
    btn.disabled = false;
    btn.textContent = 'Run Scan Now';
  };
}

loadReport();
setInterval(loadReport, 60000);
</script>

</body>
</html>
